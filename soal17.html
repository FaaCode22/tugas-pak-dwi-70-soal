<body>
<h3>Soal 17 - Deret n+10 n-5</h3>
<p>Buat tampilan 2 12 7 17 12 22 17 27 22 32</p>
<script>
// soal17.html - Soal 17 - Deret n+10 n-5
var a = 2;
document.write(a + " ");
for (var i = 1; i <= 9; i++) {
  if (i % 2 == 1) {
    a = a + 10;
  } else {
    a = a - 5;
  }
  document.write(a + " ");
}
</script>
</body>
