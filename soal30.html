<body>
<h3>Soal 30 - Habis dibagi 4</h3>
<p>Bilangan habis dibagi 4 dari n_awal sampai n_akhir</p>
<script>
// soal30.html - Soal 30 - Habis dibagi 4
var awal = prompt("Masukkan n_awal : ");
var akhir = prompt("Masukkan n_akhir : ");
awal = parseInt(awal);
akhir = parseInt(akhir);
for (var i = awal; i <= akhir; i++) {
  if (i % 4 == 0) {
    document.write(i + " ");
  }
}
</script>
</body>
</html>
