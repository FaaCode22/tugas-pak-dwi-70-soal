<body>
<h3>Soal 8 - Pola 112333123455555123456</h3>
<p>Buat tampilan 112333123455555123456 (ganjil diulang, genap berurut)</p>
<script>
// soal08.html - Soal 8 - Pola 112333123455555123456
var hasil = "";
for (var i = 1; i <= 6; i++) {
  if (i % 2 == 1) {
    // ganjil : tulis i sebanyak i kali
    for (var j = 1; j <= i; j++) {
      hasil = hasil + i;
    }
  } else {
    // genap : tulis 1 sampai i
    for (var k = 1; k <= i; k++) {
      hasil = hasil + k;
    }
  }
}
document.write(hasil);
</script>
</body>
