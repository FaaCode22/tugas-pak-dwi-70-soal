<html>
<head>
<title>bintang02.html</title>
</head>
<body>
<h3>Bintang 2 - Piramid</h3>
<p>Formasi bintang 2</p>
<script>
// bintang02.html - Bintang 2 - Piramid
for (var i = 1; i <= 6; i++) {
  var bintang = 2 * i - 1;
  var spasi = 6 - i;
  for (var s = 0; s < spasi; s++) {
    document.write("&nbsp;&nbsp;");
  }
  for (var b = 0; b < bintang; b++) {
    document.write("*");
  }
  document.write("<br>");
}
</script>
</body>
</html>
