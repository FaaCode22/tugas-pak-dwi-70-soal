<html>
<head>
<title>bintang14.html</title>
</head>
<body>
<h3>Bintang 14 - Segitiga bintang kiri</h3>
<p>Formasi bintang 14</p>
<script>
// bintang14.html - Bintang 14 - Segitiga bintang kiri
for (var i = 1; i <= 6; i++) {
  for (var a = 1; a <= i; a++) {
    document.write("*");
  }
  var nol = 7 - i;
  for (var b = 1; b <= nol; b++) {
    document.write("0");
  }
  document.write("<br>");
}
</script>
</body>
</html>
