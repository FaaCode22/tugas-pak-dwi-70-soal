<body>
<h3>Soal 31 - Habis dibagi 5</h3>
<p>Bilangan habis dibagi 5 dari n_awal sampai n_akhir</p>
<script>
// soal31.html - Soal 31 - Habis dibagi 5
var awal = prompt("Masukkan n_awal : ");
var akhir = prompt("Masukkan n_akhir : ");
awal = parseInt(awal);
akhir = parseInt(akhir);
for (var i = awal; i <= akhir; i++) {
  if (i % 5 == 0) {
    document.write(i + " ");
  }
}
</script>
</body>
</html>
