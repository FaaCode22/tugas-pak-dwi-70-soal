<body>
<h3>Soal 3 - Hitung Karakter</h3>
<p>Masukkan kalimat, hitung jumlah karakter</p>
<script>
// soal03.html - Soal 3 - Hitung Karakter
var kalimat = prompt("Masukkan kalimat : ");
var jumlah = 0;
// hitung manual pakai looping biar jelas
for (var i = 0; i < kalimat.length; i++) {
  jumlah = jumlah + 1;
}
document.write("Jumlah karakter : " + jumlah);
</script>
</body>
</html>
