<body>
<h3>Bintang 13 - Segitiga 0 kiri</h3>
<p>Formasi bintang 13</p>
<script>
// bintang13.html - Bintang 13 - Segitiga 0 kiri
for (var i = 1; i <= 6; i++) {
  for (var a = 1; a <= i; a++) {
    document.write("0");
  }
  var bintang = 7 - i;
  for (var b = 1; b <= bintang; b++) {
    document.write("*");
  }
  document.write("<br>");
}
</script>
</body>
</html>
