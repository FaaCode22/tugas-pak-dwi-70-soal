<head>

</head>
<body>
<h3>Bintang 18 - Diagonal kiri</h3>
<p>Formasi bintang 18</p>
<script>
// bintang18.html - Bintang 18 - Diagonal kiri
for (var i = 1; i <= 6; i++) {
  for (var baris = 1; baris <= 7; baris++) {
    if (baris == i) {
      document.write("*");
    } else {
      document.write("0");
    }
  }
  document.write("<br>");
}
</script>
</body>
</html>
