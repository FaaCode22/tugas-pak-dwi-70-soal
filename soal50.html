<html>
<head>
<title>soal50.html</title>
</head>
<body>
<h3>Soal 50 - Total Prima</h3>
<p>Jumlah total prima dari n_awal sampai n_akhir</p>
<script>
// soal50.html - Soal 50 - Total Prima
var awal = prompt("Masukkan n_awal : ");
var akhir = prompt("Masukkan n_akhir : ");
awal = parseInt(awal);
akhir = parseInt(akhir);
var total = 0;
for (var i = awal; i <= akhir; i++) {
  var prima = true;
  if (i < 2) {
    prima = false;
  }
  for (var j = 2; j < i; j++) {
    if (i % j == 0) {
      prima = false;
    }
  }
  if (prima == true) {
    total = total + i;
  }
}
document.write("Total prima : " + total);
</script>
</body>
</html>
