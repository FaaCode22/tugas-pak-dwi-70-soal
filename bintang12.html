<body>
<h3>Bintang 12 - Kotak 0 atas kanan</h3>
<p>Formasi bintang 12</p>
<script>
// bintang12.html - Bintang 12 - Kotak 0 atas kanan
for (var k = 1; k <= 11; k++) {
  document.write("0");
}
document.write("<br>");
for (var i = 1; i <= 5; i++) {
  for (var j = 1; j <= 10; j++) {
    document.write("*");
  }
  document.write("0<br>");
}
</script>
</body>
</html>
