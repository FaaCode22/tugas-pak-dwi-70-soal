<body>
<h3>Soal 15 - Pola mundur</h3>
<p>Buat tampilan 876543217654321666666555554321321221</p>
<script>
// soal15.html - Soal 15 - Pola mundur
var hasil = "";
for (var i = 8; i >= 1; i--) {
  if (i == 8 || i == 7 || i == 4 || i == 3) {
    for (var k = i; k >= 1; k--) {
      hasil = hasil + k;
    }
  } else {
    for (var j = 1; j <= i; j++) {
      hasil = hasil + i;
    }
  }
}
document.write(hasil);
</script>
</body>
