<body>
<h3>Soal 33 - Habis dibagi 7</h3>
<p>Bilangan habis dibagi 7 dari n_awal sampai n_akhir</p>
<script>
// soal33.html - Soal 33 - Habis dibagi 7
var awal = prompt("Masukkan n_awal : ");
var akhir = prompt("Masukkan n_akhir : ");
awal = parseInt(awal);
akhir = parseInt(akhir);
for (var i = awal; i <= akhir; i++) {
  if (i % 7 == 0) {
    document.write(i + " ");
  }
}
</script>
</body>
</html>
