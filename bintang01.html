<html>
<head>
<title>bintang01.html</title>
</head>
<body>
<h3>Bintang 1 - Huruf V</h3>
<p>Formasi bintang 1</p>
<script>
// bintang01.html - Bintang 1 - Huruf V
var tinggi = 6;
var lebar = 11;
for (var r = 0; r < tinggi; r++) {
  if (r == 0) {
    for (var k = 0; k < lebar; k++) {
      document.write("*");
    }
  } else {
    var kiri = 6 - r;
    var spasi = 2 * r - 1;
    for (var a = 0; a < kiri; a++) {
      document.write("*");
    }
    for (var s = 0; s < spasi; s++) {
      document.write("&nbsp;&nbsp;");
    }
    for (var b = 0; b < kiri; b++) {
      document.write("*");
    }
  }
  document.write("<br>");
}
</script>
</body>
</html>
