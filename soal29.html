<body>
<h3>Soal 29 - Habis dibagi 3</h3>
<p>Bilangan habis dibagi 3 dari n_awal sampai n_akhir</p>
<script>
// soal29.html - Soal 29 - Habis dibagi 3
var awal = prompt("Masukkan n_awal : ");
var akhir = prompt("Masukkan n_akhir : ");
awal = parseInt(awal);
akhir = parseInt(akhir);
for (var i = awal; i <= akhir; i++) {
  if (i % 3 == 0) {
    document.write(i + " ");
  }
}
</script>
</body>
</html>
