<body>
<h3>Soal 18 - Deret n-3 n+5</h3>
<p>Buat tampilan 5 2 7 4 9 6 11 8 13 10 15 12</p>
<script>
// soal18.html - Soal 18 - Deret n-3 n+5
var a = 5;
document.write(a + " ");
for (var i = 1; i <= 11; i++) {
  if (i % 2 == 1) {
    a = a - 3;
  } else {
    a = a + 5;
  }
  document.write(a + " ");
}
</script>
</body>
</html>
