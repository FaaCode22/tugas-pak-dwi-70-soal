<html>
<head>
<title>bintang10.html</title>
</head>
<body>
<h3>Bintang 10 - Panah kiri</h3>
<p>Formasi bintang 10</p>
<script>
// bintang10.html - Bintang 10 - Panah kiri
for (var i = 6; i >= 1; i--) {
  for (var b = 0; b < i; b++) {
    document.write("*");
  }
  document.write("<br>");
}
for (var j = 2; j <= 5; j++) {
  for (var c = 0; c < j; c++) {
    document.write("*");
  }
  document.write("<br>");
}
</script>
</body>
</html>
