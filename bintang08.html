<h3>Bintang 8 - Kotak 0 kiri</h3>
<p>Formasi bintang 8</p>
<script>
// bintang08.html - Bintang 8 - Kotak 0 kiri
for (var i = 1; i <= 5; i++) {
  document.write("0");
  for (var j = 1; j <= 10; j++) {
    document.write("*");
  }
  document.write("<br>");
}
for (var k = 1; k <= 11; k++) {
  document.write("0");
}
</script>
