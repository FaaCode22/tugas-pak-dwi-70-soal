<body>
<h3>Bintang 11 - Kotak 0 atas</h3>
<p>Formasi bintang 11</p>
<script>
// bintang11.html - Bintang 11 - Kotak 0 atas
for (var k = 1; k <= 11; k++) {
  document.write("0");
}
document.write("<br>");
for (var i = 1; i <= 5; i++) {
  document.write("0");
  for (var j = 1; j <= 10; j++) {
    document.write("*");
  }
  document.write("<br>");
}
</script>
</body>
