<body>
<h3>Bintang 17 - Diagonal kanan</h3>
<p>Formasi bintang 17</p>
<script>
// bintang17.html - Bintang 17 - Diagonal kanan
for (var i = 1; i <= 6; i++) {
  for (var baris = 1; baris <= 7; baris++) {
    if (baris == 8 - i) {
      document.write("*");
    } else {
      document.write("0");
    }
  }
  document.write("<br>");
}
</script>
</body>
</html>
