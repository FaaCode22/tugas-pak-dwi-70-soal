<body>
<h3>Soal 16 - Deret n+4 n-2</h3>
<p>Buat tampilan 1 5 3 7 5 9 7 11 9 13 11 15</p>
<script>
// soal16.html - Soal 16 - Deret n+4 n-2
var a = 1;
document.write(a + " ");
for (var i = 1; i <= 11; i++) {
  if (i % 2 == 1) {
    a = a + 4;
  } else {
    a = a - 2;
  }
  document.write(a + " ");
}
</script>
</body>
</html>
