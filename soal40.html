<html>

<title>soal40.html</title>
</head>
<body>
<h3>Soal 40 - Animasi 0 atas-bawah kanan (ulang)</h3>
<p>Animasi 0 kanan atas ke kanan bawah, ulang dari atas</p>
<pre id="layar"></pre>
<script>
// soal40.html - Soal 40 - Animasi 0 atas-bawah kanan (ulang)
var pos = 0;
var tinggi = 10;
var lebar = 20;
function jalan() {
  var teks = "";
  for (var i = 0; i < tinggi; i++) {
    var baris = "";
    for (var s = 0; s < lebar; s++) {
      baris = baris + " ";
    }
    if (i == pos) {
      baris = baris + "0";
    } else {
      baris = baris + " ";
    }
    teks = teks + baris + "\n";
  }
  document.getElementById("layar").innerHTML = teks;
  pos = pos + 1;
  if (pos >= tinggi) {
    pos = 0;
  }
}
setInterval(jalan, 300);
</script>
</body>
</html>
