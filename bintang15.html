<html>
<head>
<title>bintang15.html</title>
</head>
<body>
<h3>Bintang 15 - Segitiga kanan</h3>
<p>Formasi bintang 15</p>
<script>
// bintang15.html - Bintang 15 - Segitiga kanan
for (var i = 1; i <= 6; i++) {
  var nol = 7 - i;
  for (var a = 1; a <= nol; a++) {
    document.write("0");
  }
  for (var b = 1; b <= i; b++) {
    document.write("*");
  }
  document.write("<br>");
}
</script>
</body>
</html>
