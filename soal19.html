<body>
<h3>Soal 19 - Deret n*3 n-5</h3>
<p>Buat tampilan 3 9 4 12 7 21 16 48 43 129</p>
<script>
// soal19.html - Soal 19 - Deret n*3 n-5
var a = 3;
document.write(a + " ");
for (var i = 1; i <= 9; i++) {
  if (i % 2 == 1) {
    a = a * 3;
  } else {
    a = a - 5;
  }
  document.write(a + " ");
}
</script>
</body>
