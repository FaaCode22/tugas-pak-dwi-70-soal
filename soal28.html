<body>
<h3>Soal 28 - Kabisat akhir 8</h3>
<p>Tahun kabisat dari n_awal sampai n_akhir yang angka terakhirnya 8</p>
<script>
// soal28.html - Soal 28 - Kabisat akhir 8
var awal = prompt("Masukkan tahun awal : ");
var akhir = prompt("Masukkan tahun akhir : ");
awal = parseInt(awal);
akhir = parseInt(akhir);
for (var th = awal; th <= akhir; th++) {
  if (th % 4 == 0 && th % 10 == 8) {
    document.write(th + " ");
  }
}
</script>
</body>
